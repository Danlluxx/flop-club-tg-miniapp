name: flop-club

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: 4000
      BOT_TOKEN: ${BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      ADDITIONAL_FRONTEND_URLS: ${ADDITIONAL_FRONTEND_URLS:-}
      ADMIN_TELEGRAM_USERNAMES: ${ADMIN_TELEGRAM_USERNAMES}
      TELEGRAM_REMINDER_CHAT_ID: ${TELEGRAM_REMINDER_CHAT_ID:-}
      TELEGRAM_RATING_CHAT_ID: ${TELEGRAM_RATING_CHAT_ID:-@flopclub}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-FlopClubBot}
      TELEGRAM_APP_NAME: ${VITE_TELEGRAM_APP_NAME:-}
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-15000}
      TOURNAMENT_REMINDER_BROADCAST_USERS: ${TOURNAMENT_REMINDER_BROADCAST_USERS-true}
      TOURNAMENT_REMINDERS_ENABLED: ${TOURNAMENT_REMINDERS_ENABLED-true}
      ALLOW_CANCEL_AFTER_CLOSE: ${ALLOW_CANCEL_AFTER_CLOSE:-false}
      CLOCK_API_TOKEN: ${CLOCK_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run prisma:deploy:prod --workspace @flop-club/api && node apps/api/dist/index.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SUPPORT_URL: ${VITE_SUPPORT_URL:-https://t.me/flopclub}
    restart: unless-stopped
    depends_on:
      - api

  blind-clock:
    build:
      context: ../flop-club-blind
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /clock/
        VITE_BOT_BRIDGE_URL: /clock
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVE_STATIC: "true"
      HOST: 0.0.0.0
      PORT: 5175
      TELEGRAM_BOT_TOKEN: ${BLIND_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${BLIND_TELEGRAM_ALLOWED_CHAT_ID:-}
      BRIDGE_COMMAND_TOKEN: ${BLIND_BRIDGE_COMMAND_TOKEN}
      FLOP_CLUB_TG_PARTICIPANTS_URL: http://api:4000/api/clock/participants
      FLOP_CLUB_TG_TOKEN: ${CLOCK_API_TOKEN}
      FLOP_CLUB_TG_TOURNAMENT_ID: ${BLIND_FLOP_CLUB_TG_TOURNAMENT_ID:-}
      PARTICIPANTS_CACHE_MS: 10000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
      - blind-clock

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      # Workers VPC requires QUIC (or auto) for tunnel connectivity.
      - quic
      - --metrics
      - 0.0.0.0:2000
      - run
    depends_on:
      - caddy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
